  <link rel="manifest" href="manifest.json" />

  <meta name="apple-mobile-web-app-title" content="Test Info">
  <meta name="application-name" content="Test Info">
  <meta name="theme-color" content="#FFF7ED" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 15px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #FFF7ED;

      display: flex;
      justify-content: center;

    .card {
      background: #FFF7ED;
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 600px;
      border: 1px solid #f0e0d2;
      margin: 0 auto;
      text-align: center;
    }

    main {
      width: 100%;
      margin: 0 auto;
      text-align: left;
    }

    .banner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      border-bottom: 2px solid #007bff;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .logo {
      display: block;
      max-width: 220px;
      width: 100%;
      height: auto;
      margin: 0 auto 10px auto;
    }

    .titulo-test {
      font-weight: bold;
      font-size: 1.25rem;
      color: #111;
      text-align: center;
      display: block;
      width: 100%;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.75rem;
      color: #444;
      font-weight: bold;
    }

    .timer {
      font-weight: 600;
      margin-bottom: 1rem;
      color: #b71c1c;

      font-size: 1.1rem;
    }

    .question {
      margin-bottom: 1.5rem;

    .question h3 {
      margin: 0 0 .5rem;
      font-size: 1rem;

    .options label {
      display: block;
      margin: .25rem 0;
      cursor: pointer;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
      justify-content: center;
    }

    button {
      background: #007bff;
      color: #fff;
      border: none;
      padding: .6rem 1.2rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: .95rem;
      font-weight: bold;
      flex: 1;
      min-width: 120px;
    }

    button:hover {
      background: #0056b3;
    }

    button.secondary {
      background: #e0e0e0;
      color: #222;
    }

    button.secondary:hover {
      background: #d0d0d0;
    }

    button:disabled {
      opacity: .6;
      cursor: default;

    .results {
      margin-top: 1rem;
      padding: .75rem;
      border-radius: 6px;
      background: #e3f2fd;
      text-align: center;

    .correct {
      color: #1b5e20;
      font-weight: 600;

      color: #b71c1c;

      margin: .3rem 0;

  </style>
</head>
<body>

<div class="card">

  <div class="banner">
    <img src="logo_.png" alt="Informática Q Aluche" class="logo">
    <span class="titulo-test">Test de conocimientos de Word</span>
    <div class="subtitle">INFORMÁTICA Q ALUCHE</div>
  </div>

  <main>
    <div class="timer" id="timer">Tiempo: 10:00</div>
    <form id="quizForm"></form>

    <div class="actions">
      <button type="button" id="submitBtn">Corregir</button>
      <button type="button" id="retryBtn" class="secondary" disabled>Volver a intentar</button>
      <button type="button" id="shuffleBtn" class="secondary" disabled>Mezclar preguntas</button>
    </div>

    <div id="results" class="results" style="display:none;"></div>
    <div id="answerKey" class="answer-key" style="display:none;"></div>
  </main>

</div>

<script>
  const questionsBase = [
    {
      text: "¿Qué hace Ctrl + N?",
      options: [
        "Abre un documento nuevo",
        "Guarda el documento",
        "Copia texto",
        "Cierra Word"
      ],
      correctIndex: 0
    },
    {
      text: "¿Qué opción muestra caracteres no imprimibles?",
      options: [
        "Inicio → Mostrar u ocultar ¶",
        "Vista → Diseño",
        "Revisar → Control de cambios",
        "Diseño → Márgenes"
      ],
      correctIndex: 0
    },
    {
      text: "¿Qué es un estilo?",
      options: [
        "Un tipo de archivo",
        "Un conjunto de formatos predefinidos",
        "Un encabezado",
        "Un comentario"
      ],
      correctIndex: 1
    },
    {
      text: "¿Qué hace Ctrl + S?",
      options: [
        "Guarda",
        "Sustituye texto",
        "Selecciona todo",
        "Inserta un salto"
      ],
      correctIndex: 0
    },
    {
      text: "¿Dónde se activa el Control de cambios?",
      options: [
        "Insertar",
        "Revisar",
        "Vista",
        "Diseño"
      ],
      correctIndex: 1
    },
    {
      text: "¿Qué es un salto de página?",
      options: [
        "Un cambio de sección",
        "Un salto que inicia una página nueva",
        "Un salto de columna",
        "Un marcador"
      ],
      correctIndex: 1
    },
    {
      text: "¿Qué hace Ctrl + Z?",
      options: [
        "Rehacer",
        "Deshacer",
        "Copiar",
        "Cortar"
      ],
      correctIndex: 1
    },
    {
      text: "¿Qué elemento permite numerar automáticamente títulos?",
      options: [
        "Estilos",
        "Tablas",
        "Encabezados",
        "Comentarios"
      ],
      correctIndex: 0
    },
    {
      text: "¿Qué es una tabla?",
      options: [
        "Un gráfico",
        "Una estructura de filas y columnas",
        "Un estilo",
        "Un encabezado"
      ],
      correctIndex: 1
    },
    {
      text: "¿Qué hace Ctrl + P?",
      options: [
        "Imprime",
        "Pega",
        "Inserta un párrafo",
        "Abre propiedades"
      ],
      correctIndex: 0
    },
    {
      text: "¿Qué opción permite insertar un encabezado?",
      options: [
        "Insertar → Encabezado",
        "Inicio → Estilos",
        "Revisar → Comentarios",
        "Vista → Diseño"
      ],
      correctIndex: 0
    },
    {
      text: "¿Qué es un comentario?",
      options: [
        "Un estilo",
        "Una nota asociada al texto",
        "Un encabezado",
        "Un pie de página"
      ],
      correctIndex: 1
    },
    {
      text: "¿Qué hace Ctrl + B?",
      options: [
        "Subraya",
        "Negrita",
        "Cursiva",
        "Copia"
      ],
      correctIndex: 1
    },
    {
      text: "¿Qué es una plantilla?",
      options: [
        "Un documento con formato predefinido",
        "Un comentario",
        "Un estilo",
        "Un gráfico"
      ],
      correctIndex: 0
    },
    {
      text: "¿Qué opción permite revisar ortografía?",
      options: [
        "Revisar → Ortografía y gramática",
        "Inicio → Estilos",
        "Vista → Diseño",
        "Insertar → Texto"
      ],
      correctIndex: 0
    }
  ];

  let questions = [];
  let timerInterval = null;
  const totalSeconds = 10 * 60;
  let remainingSeconds = totalSeconds;

  const quizForm = document.getElementById("quizForm");
  const submitBtn = document.getElementById("submitBtn");
  const retryBtn = document.getElementById("retryBtn");
  const shuffleBtn = document.getElementById("shuffleBtn");
  const resultsDiv = document.getElementById("results");
  const answerKeyDiv = document.getElementById("answerKey");
  const timerDiv = document.getElementById("timer");

  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function renderQuiz() {
    quizForm.innerHTML = "";
    questions.forEach((q, index) => {
      const qDiv = document.createElement("div");
      qDiv.className = "question";

      const title = document.createElement("h3");
      title.textContent = `${index + 1}. ${q.text}`;
      qDiv.appendChild(title);

      const optionsDiv = document.createElement("div");
      optionsDiv.className = "options";

      q.options.forEach((opt, optIndex) => {
        const id = `q${index}_opt${optIndex}`;
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = `q${index}`;
        input.value = optIndex;
        input.id = id;

        label.setAttribute("for", id);
        label.appendChild(input);
        label.appendChild(document.createTextNode(" " + opt));
        optionsDiv.appendChild(label);
      });

      qDiv.appendChild(optionsDiv);
      quizForm.appendChild(qDiv);
    });
  }

  function formatTime(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, "0");
    const s = String(sec % 60).padStart(2, "0");
    return `${m}:${s}`;
  }

  function startTimer() {
    clearInterval(timerInterval);
    remainingSeconds = totalSeconds;
    timerDiv.textContent = "Tiempo: " + formatTime(remainingSeconds);
    timerInterval = setInterval(() => {
      remainingSeconds--;
      timerDiv.textContent = "Tiempo: " + formatTime(remainingSeconds);
      if (remainingSeconds <= 0) {
        clearInterval(timerInterval);
        timerDiv.textContent = "Tiempo agotado";
        submitQuiz(true);
      }
    }, 1000);
  }

  function submitQuiz(fromTimer = false) {
    let score = 0;
    const total = questions.length;
    const answers = [];

    questions.forEach((q, index) => {
      const selected = quizForm.querySelector(`input[name="q${index}"]:checked`);
      const selectedIndex = selected ? parseInt(selected.value, 10) : null;
      const isCorrect = selectedIndex === q.correctIndex;
      if (isCorrect) score++;
      answers.push({ index, selectedIndex, correctIndex: q.correctIndex });
    });

    resultsDiv.style.display = "block";
    resultsDiv.innerHTML = `
      <strong>Resultado:</strong> ${score} / ${total}
      ${fromTimer ? "<br>El tiempo ha finalizado." : ""}
    `;

    answerKeyDiv.style.display = "block";
    answerKeyDiv.innerHTML = "<strong>Soluciones:</strong>";
    answers.forEach((a, i) => {
      const q = questions[i];
      const correctText = q.options[a.correctIndex];
      const selectedText = a.selectedIndex != null ? q.options[a.selectedIndex] : "Sin respuesta";
      const p = document.createElement("p");
      const cls = a.selectedIndex === a.correctIndex ? "correct" : "incorrect";
      p.innerHTML = `${i + 1}. <span class="${cls}">Correcta: ${correctText}</span> | Tu respuesta: ${selectedText}`;
      answerKeyDiv.appendChild(p);
    });

    submitBtn.disabled = true;
    retryBtn.disabled = false;
    shuffleBtn.disabled = false;
    clearInterval(timerInterval);
  }

  function resetQuiz(shuffle = false) {
    resultsDiv.style.display = "none";
    answerKeyDiv.style.display = "none";
    submitBtn.disabled = false;
    retryBtn.disabled = true;
    shuffleBtn.disabled = true;

    questions = shuffle ? shuffleArray(questionsBase) : [...questionsBase];
    renderQuiz();
    startTimer();
  }

  submitBtn.addEventListener("click", () => submitQuiz(false));
  retryBtn.addEventListener("click", () => resetQuiz(false));
  shuffleBtn.addEventListener("click", () => resetQuiz(true));

  questions = [...questionsBase];
  renderQuiz();
  startTimer();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
